[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "livescreen-translator-pro"
version = "0.5.0"
description = "Windows live screen translation overlay"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "mss>=10,<11",
    "numpy>=2.0,<3",
    "opencv-contrib-python==4.10.0.84",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "psutil>=7,<8",
    "paddlepaddle>=3.2,<4",
    "paddleocr>=3.3,<4",
    "ctranslate2>=4.8,<5",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
livescreen-translator = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources" = ["icons/*.ico", "icons/*.png", "models/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

